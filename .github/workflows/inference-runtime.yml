name: Managed inference release smoke
on:
  pull_request:
    paths:
      - 'core/inference*'
      - 'pyproject.toml'
      - 'ops/ci/inference_runtime_smoke.py'
      - '.github/workflows/inference-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and install the distribution
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install --no-deps --find-links dist hexis
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hexis-inference-cache
          key: inference-${{ runner.os }}-${{ hashFiles('core/inference_assets.json') }}
      - name: Exercise Linux private-bridge connectivity
        if: runner.os == 'Linux'
        run: |
          docker network create --label com.docker.compose.network=private hexis-inference-private
          docker run -d --name hexis_brain --network hexis-inference-private alpine sleep 1800
      - name: Verify CPU fallback from packaged assets
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/hexis-inference-cache
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/ops/ci/inference_runtime_smoke.py
